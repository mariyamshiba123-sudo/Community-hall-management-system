<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Community Hall</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init({publicKey:"H9EoNRo_8MGJ3oCAX"});</script>
</head>
<body class="bg-gray-100 p-6">
<div class="max-w-5xl mx-auto">
<h1 class="text-3xl font-bold">Community Hall - Admin Panel</h1>
<p class="text-gray-500 mb-6">Approve/Reject - Email will be sent automatically</p>
<div id="list" class="space-y-3"><p class="bg-white p-4 rounded shadow">Loading bookings...</p></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAt_YE6dVIAIDW-tDkoJU2er3iZThfXJo",
  authDomain: "communityhallmanagement.firebaseapp.com",
  projectId: "communityhallmanagement",
  storageBucket: "communityhallmanagement.firebasestorage.app",
  messagingSenderId: "571726922784",
  appId: "1:571726922784:web:ba70f0251a3cc0f87e2845"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function load(){
  const el=document.getElementById("list");
  try{
    const snap=await getDocs(collection(db,"bookings"));
    if(snap.empty){ el.innerHTML="<p class='bg-white p-4 rounded'>No bookings found</p>"; return; }
    el.innerHTML="";
    snap.forEach(d=>{
      const data=d.data();
      el.innerHTML+=`<div class="bg-white p-4 rounded shadow flex justify-between items-center">
      <div><b>${data.name||data.customer_name||'Customer'}</b> - ${data.email}<br>Date: ${data.date||data.booking_date||''} | <b class="text-blue-600">${data.status||'Pending'}</b></div>
      <div class="flex gap-2"><button onclick="changeStatus('${d.id}','Approved')" class="bg-green-600 text-white px-4 py-2 rounded">Approve</button><button onclick="changeStatus('${d.id}','Rejected')" class="bg-red-600 text-white px-4 py-2 rounded">Reject</button></div></div>`;
    });
  }catch(e){
    el.innerHTML="<p class='bg-red-100 p-4'>Error: "+e.message+"</p>";
    console.error(e);
  }
}

window.changeStatus=async(id,newStatus)=>{
  if(!confirm("Mark as "+newStatus+" and send email?")) return;
  const ref=doc(db,"bookings",id);
  const snap=await getDoc(ref);
  const data=snap.data();
  await updateDoc(ref,{status:newStatus});
  try{
    await emailjs.send("service_cfacxic","template_xccag9n",{
      name: data.name||data.customer_name||"Customer",
      email: data.email,
      booking_status: newStatus,
      message: `Your booking for ${data.date||data.booking_date||''} has been ${newStatus}. Ref: ${id}`,
      booking_date: data.date||data.booking_date||"",
      event_type: data.event||data.event_type||"Hall Booking",
      booking_reference: id
    });
    alert("✅ "+newStatus+" & Email sent to "+data.email);
  }catch(err){
    alert("Status updated to "+newStatus+" but email failed: "+(err.text||err.message));
  }
  load();
}
load();
</script>
</body>
</html>
