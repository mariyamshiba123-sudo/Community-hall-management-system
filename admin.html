<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Community Hall</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>emailjs.init({publicKey:"H9EoNRo_8MGJ3oCAX"});</script>
</head>
<body class="bg-gray-100 p-6">
<div class="max-w-6xl mx-auto">
<h1 class="text-3xl font-bold">Community Hall - Admin Panel</h1>
<p class="text-gray-500 mb-6">Full customer details below</p>
<div id="list" class="space-y-4">Loading bookings...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAt_YE6dVIAIDW-tDkoJU2er3iZThfXJo",
  authDomain: "communityhallmanagement.firebaseapp.com",
  projectId: "communityhallmanagement",
  storageBucket: "communityhallmanagement.firebasestorage.app",
  messagingSenderId: "571726922784",
  appId: "1:571726922784:web:ba70f0251a3cc0f87e2845"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getField(data, ...keys){
  for(let k of keys){
    if(data[k] !== undefined && data[k] !== "" ) return data[k];
  }
  return "N/A";
}

async function load(){
  const el=document.getElementById("list");
  const snap=await getDocs(collection(db,"bookings"));
  if(snap.empty){ el.innerHTML="No bookings"; return; }
  el.innerHTML="";
  snap.forEach(d=>{
    const data=d.data();
    const id=d.id;
    
    const name = getField(data, "name","customer_name","customerName","fullName","userName","username","cust_name");
    const email = getField(data, "email","customer_email","customerEmail","mail","userEmail");
    const phone = getField(data, "phone","mobile","customer_phone","phoneNumber","contact");
    const date = getField(data, "date","booking_date","bookingDate","eventDate","hall_date");
    const event = getField(data, "event","event_type","eventType","functionType","purpose");
    const guests = getField(data, "guests","guestCount","people","attendees");
    const status = data.status||"Pending";

    el.innerHTML+=`
    <div class="bg-white p-5 rounded shadow">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3 text-sm">
        <div><b>Customer Name:</b><br>${name}</div>
        <div><b>Email:</b><br>${email}</div>
        <div><b>Phone:</b><br>${phone}</div>
        <div><b>Status:</b><br><span class="font-bold text-blue-600">${status}</span></div>
        <div><b>Booking Date:</b><br>${date}</div>
        <div><b>Event Type:</b><br>${event}</div>
        <div><b>Guests:</b><br>${guests}</div>
        <div><b>Ref ID:</b><br><span class="text-xs">${id}</span></div>
      </div>
      <div class="flex gap-2">
        <button onclick="changeStatus('${id}','Approved')" class="bg-green-600 text-white px-5 py-2 rounded">Approve</button>
        <button onclick="changeStatus('${id}','Rejected')" class="bg-red-600 text-white px-5 py-2 rounded">Reject</button>
      </div>
    </div>`;
  });
}

window.changeStatus=async(id,newStatus)=>{
  if(!confirm("Mark as "+newStatus+" and send email?")) return;
  const ref=doc(db,"bookings",id);
  const snap=await getDoc(ref);
  const data=snap.data();
  const email = getField(data, "email","customer_email","customerEmail","mail","userEmail");
  const name = getField(data, "name","customer_name","customerName","fullName","userName","username","cust_name");
  
  await updateDoc(ref,{status:newStatus});
  try{
    await emailjs.send("service_cfacxic","template_xccag9n",{
      name: name,
      email: email,
      booking_status: newStatus,
      message: `Dear ${name}, Your booking for ${getField(data, "date","booking_date","bookingDate")} (${getField(data, "event","eventType")}) has been ${newStatus}. Ref: ${id}`,
      booking_date: getField(data, "date","booking_date","bookingDate"),
      event_type: getField(data, "event","eventType"),
      booking_reference: id
    });
    alert("✅ "+newStatus+"! Email sent to "+email);
  }catch(err){
    alert("Status updated but email failed: "+(err.text||err.message));
  }
  load();
}
load();
</script>
</body>
</html>
