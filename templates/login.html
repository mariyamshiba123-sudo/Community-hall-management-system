<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Community Hall</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #faf7f0;
            font-family: Arial, sans-serif;
            color: #463625;
        }

        .login-card {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            background: white;
            border: 1px solid #e5d5b5;
            border-radius: 16px;
            box-shadow: 0 8px 25px #00000012;
        }

        h1 {
            text-align: center;
            color: #765326;
            margin-top: 0;
        }

        p {
            text-align: center;
            color: #766b5e;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8c8ad;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            border: none;
            border-radius: 8px;
            background: #98713b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #765326;
        }

        .error {
            padding: 12px;
            border-radius: 8px;
            background: #fde9e7;
            color: #8a2520;
            margin-bottom: 15px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #765326;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>Admin Login</h1>
        <p>Sign in to manage hall bookings.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" required>

            <button type="submit">Log In</button>
        </form>

        <a class="back-link" href="/">← Back to Home</a>
    </main>
</body>
</html>
